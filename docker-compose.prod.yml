# Production Docker Compose for Unraid Deployment
# Usage: docker-compose -f docker-compose.prod.yml up -d --build

services:
  # Frontend - Vue + Vuetify + Vite
  frontend:
    build:
      context: ./frontend/deck-optimizer-frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: deckoptimizer-frontend
    restart: unless-stopped
    ports:
      - "8284:80"
    networks:
      - deckoptimizer-network
    depends_on:
      - backend

  # Backend - Laravel + PHP 8.4
  backend:
    build:
      context: ./docker/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        WWWUSER: '${WWWUSER:-1000}'
    container_name: deckoptimizer-backend
    image: deckoptimizer-sail-8.4/app
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      
      APP_NAME: '${APP_NAME}'
      APP_ENV: '${APP_ENV}'
      APP_KEY: '${APP_KEY}'
      APP_DEBUG: '${APP_DEBUG}'
      APP_URL: '${APP_URL}'
      
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS}'
      PUPPETEER_SERVICE_URL: '${PUPPETEER_SERVICE_URL}'
      
    ports:
      - '8765:80'
    volumes:
      # Mount everything from host (including vendor)
      - '.:/var/www/html'
      # Only separate data directories
      - '/mnt/user/appdata/deckoptimizer/storage:/var/www/html/storage'
      - '/mnt/user/appdata/deckoptimizer/bootstrap-cache:/var/www/html/bootstrap/cache'
      - '/mnt/user/appdata/deckoptimizer/data:/var/www/html/data'
    networks:
      - deckoptimizer-network
    depends_on:
      mysql:
        condition: service_healthy

  # Database - MySQL 8.0
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: deckoptimizer-mysql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - '/mnt/user/appdata/deckoptimizer/mysql:/var/lib/mysql'
    networks:
      - deckoptimizer-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=256M

  # Puppeteer Service
  puppeteer:
    build:
      context: ./puppeteer-service
      dockerfile: Dockerfile
    container_name: deckoptimizer-puppeteer
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - puppeteer_node_modules:/app/node_modules
      - '/mnt/user/appdata/deckoptimizer/puppeteer-cache:/app/cache'
    networks:
      - deckoptimizer-network
    environment:
      - NODE_ENV=production

networks:
  deckoptimizer-network:
    driver: bridge

volumes:
  puppeteer_node_modules: