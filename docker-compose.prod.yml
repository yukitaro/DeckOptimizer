services:
  backend:
    build:
      context: .
      dockerfile: docker/8.4/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        WWWUSER: '${WWWUSER:-1000}'
    container_name: deckoptimizer-backend
    image: deckoptimizer-sail-8.4/app
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      APP_NAME: '${APP_NAME}'
      APP_ENV: '${APP_ENV}'
      APP_KEY: '${APP_KEY}'
      APP_DEBUG: '${APP_DEBUG}'
      APP_URL: '${APP_URL}'
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS}'
      PUPPETEER_SERVICE_URL: '${PUPPETEER_SERVICE_URL}'
      LARAVEL_SAIL: 1
    volumes:
      - /mnt/user/appdata/deckoptimizer/storage:/var/www/html/storage
      - /mnt/user/appdata/deckoptimizer/bootstrap-cache:/var/www/html/bootstrap/cache
      - /mnt/user/appdata/deckoptimizer/supervisor:/tmp/supervisor
    networks:
      - deckoptimizer-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master process' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: deckoptimizer-mysql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - /mnt/user/appdata/deckoptimizer/mysql:/var/lib/mysql
    networks:
      - deckoptimizer-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=256M

  puppeteer:
    build:
      context: ./puppeteer-service
      dockerfile: Dockerfile
    container_name: deckoptimizer-puppeteer
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - puppeteer_node_modules:/app/node_modules
      - /mnt/user/appdata/deckoptimizer/puppeteer-cache:/app/cache
    networks:
      - deckoptimizer-network
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: deckoptimizer-nginx
    restart: unless-stopped
    ports:
      - "8284:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/user/appdata/deckoptimizer/frontend/deck-optimizer-frontend/dist:/var/www/vue:ro
    networks:
      - deckoptimizer-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  deckoptimizer-network:
    driver: bridge

volumes:
  puppeteer_node_modules:
